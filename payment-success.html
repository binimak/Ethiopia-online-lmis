<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Receipt</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f7;
padding:10px;
}

.receipt{
max-width:400px;
margin:auto;
background:#fff;
border-radius:25px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.header{
background:linear-gradient(135deg,#003a8c,#0055d4);
color:#fff;
text-align:center;
padding:30px 15px;
border-bottom:4px solid #f0b400;
}

.header h2{
font-size:24px;
}

.badge{
display:inline-block;
margin-top:10px;
padding:8px 18px;
border-radius:30px;
background:rgba(255,255,255,.2);
}

.success{
text-align:center;
padding:35px 20px;
}

.check{
width:60px;
height:60px;
border:4px solid #28a745;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
color:#28a745;
}

.success h1{
color:#28a745;
margin-top:20px;
font-size:28px;
}

.amount{
font-size:45px;
color:#0a3b82;
font-weight:bold;
margin-top:10px;
}

.fee{
color:#666;
font-size:16px;
}

.details{
padding:25px;
}

.row{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #eee;
}

.label{
color:#666;
font-weight:bold;
}

.value{
font-weight:bold;
}

.verify{
text-align:center;
padding:25px;
background:#f8f8f8;
color:#28a745;
font-weight:bold;
}

.buttons{
display:flex;
gap:10px;
padding:20px;
}

.buttons button{
flex:1;
padding:18px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.print{
background:#f2f2f2;
}

.done{
background:#0055d4;
color:white;
}
</style>
</head>

<body>

<div class="receipt">

<div class="header">
<h2>E-LMIS Management System</h2>
<div class="badge">Official Digital Receipt</div>
</div>

<div class="success">

<div class="check">✓</div>

<h1>Payment Uploaded Successfully</h1>

<div class="amount">
ETB 1,500.00
</div>

<div class="fee">
Work Permit Processing Fee
</div>

</div>

<div class="details">

<div class="row">
<div class="label">Applicant Name</div>
<div class="value" id="name"></div>
</div>

<div class="row">
<div class="label">Passport Number</div>
<div class="value" id="passport"></div>
</div>

<div class="row">
<div class="label">Destination Country</div>
<div class="value" id="country"></div>
</div>

<div class="row">
<div class="label">Date Uploaded</div>
<div class="value" id="date"></div>
</div>

<div class="row">
<div class="label">Time Registered</div>
<div class="value" id="time"></div>
</div>

<div class="row">
<div class="label">Payment Channel</div>
<div class="value">CBE Bank Transfer</div>
</div>

</div>

<div class="verify">
🔒 SECURELY VERIFIED
</div>

<div class="buttons">
<button class="print" onclick="window.print()">
Print Receipt
</button>

<button class="done" onclick="location.href='index.html'">
Done
</button>
</div>

</div>

<script>

let user =
JSON.parse(localStorage.getItem("user"));

document.getElementById("name").innerText =
user?.name || "-";

document.getElementById("passport").innerText =
user?.passport || "-";

document.getElementById("country").innerText =
user?.country || "-";

let now = new Date();

document.getElementById("date").innerText =
now.toLocaleDateString();

document.getElementById("time").innerText =
now.toLocaleTimeString();

</script>

</body>
</html>

የሥራ ዕድል ፈጠራ ሥራውን ከዕቅድ በላይ ማሳካቱን ቢሮው አስታወቀ
</h1>

<div class="date">
ግንቦት 14, 2026
</div>

<img src="https://res.cloudinary.com/dwclusteb/image/upload/v1777243588/464968970_853668816946990_1979183023972159898_n-1-1_t9ozox.jpg">

<p>
የአዲስ አበባ ሥራና ክህሎት ቢሮ የ10 ወራት ዕቅድ አፈፃፀሙን
ከባለድርሻና አስፈፃሚ አካላት ጋር ገምግሟል።
</p>

<p>
በዚህም ለ320,000 በላይ ዜጎች የሥራ ዕድል መፍጠሩን
አስታውቋል።
</p>

*{  
  margin:0;  
  padding:0;  
  box-sizing:border-box;  
   font-family:"Inter",Arial,sans-serif;  
}  
  
body{
    background:#f3f6fb;
    font-family:Arial, sans-serif;
}
.countdown{
    display:flex;
    justify-content:flex-end;
    gap:6px;
    padding:12px 15px;
}

.box{
    width:38px;
    height:32px;
    border-radius:8px;
    background:#0b53b6;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.box:last-child{
    background:#d90429;
}

.box h1{
    font-size:10px;
    margin:0;
    line-height:1;
}

.box p{
    font-size:9px;
    margin-top:3px;
}
body::after{  
  content:"";  
  
  position:fixed;  
  
  width:300px;  
  height:300px;  
  
  background:  
  radial-gradient(  
    rgba(96,165,250,0.1),  
    transparent 70%  
  );  
  
  bottom:-120px;  
  left:-100px;  
  
  border-radius:50%;  
  
  z-index:-1;  
}
